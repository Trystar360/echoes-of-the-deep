# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Build with JDK 25 (Minecraft 26.1 requires Java 25). The toolchain is declared in
# build.gradle (java.toolchain.languageVersion = 25); settings.gradle's Foojay
# resolver auto-downloads a matching JDK if none is installed locally, so no
# machine-specific installations.paths hint is needed here.

# Fabric Properties — Minecraft 26.1.2 (the Fabric 26.1 line; Mojang official mappings)
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.152.1+26.1.2

# Mod Properties
mod_version=0.2.2
maven_group=com.echoes
archives_base_name=echoes-of-the-deep
